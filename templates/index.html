<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TrackerCG - TCG collection tracker and market value monitor" />
  <title>TrackerCG</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f59e0b'/><text x='50' y='68' font-size='52' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23020617'>T</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased">

  <!-- ============ HEADER ============ -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <button id="btn-brand" class="flex items-center gap-3 focus:outline-none" aria-label="TrackerCG home">
          <span class="flex items-center justify-center w-9 h-9 rounded-lg bg-amber-500 text-slate-950 font-extrabold text-lg shadow-lg shadow-amber-500/20">T</span>
          <span class="text-xl font-bold tracking-tight">Tracker<span class="text-amber-500">CG</span></span>
        </button>

        <nav class="hidden sm:flex items-center gap-1" aria-label="Main navigation">
          <button id="nav-dashboard" data-view="dashboard" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"></button>
          <button id="nav-search" data-view="search" class="nav-btn px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"></button>
        </nav>

        <div class="flex items-center gap-3">
          <button id="btn-lang" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium transition-all duration-200" aria-label="Change language">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
            </svg>
            <span id="lang-label">ES</span>
          </button>

          <div id="auth-anon" class="flex items-center gap-2">
            <button id="btn-login" data-i18n="login" class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all duration-200"></button>
            <button id="btn-register" data-i18n="register" class="px-4 py-2 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-slate-900 transition-all duration-200"></button>
          </div>

          <div id="auth-user" class="hidden items-center gap-3">
            <span id="user-email" class="text-sm text-slate-400 max-w-[180px] truncate hidden sm:block"></span>
            <button id="btn-logout" data-i18n="logout" class="px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-red-400 hover:bg-slate-800 transition-all duration-200"></button>
          </div>
        </div>
      </div>

      <!-- Mobile nav -->
      <nav class="sm:hidden flex items-center gap-1 pb-3" aria-label="Mobile navigation">
        <button data-view="dashboard" class="nav-btn flex-1 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"></button>
        <button data-view="search" class="nav-btn flex-1 px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200"></button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- ============ VIEW: DASHBOARD ============ -->
    <section id="view-dashboard" class="view" hidden>
      <!-- Portfolio hero -->
      <div class="bg-slate-900 rounded-xl p-6 mb-8 border border-slate-700">
        <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-6">
          <div>
            <p class="text-slate-400 text-sm mb-1" data-i18n="portfolio_value"></p>
            <p id="portfolio-total" class="text-4xl font-bold text-white tabular-nums">$0.00</p>
          </div>
          <div class="flex gap-8">
            <div>
              <p class="text-slate-400 text-sm" data-i18n="total_cards"></p>
              <p id="portfolio-cards" class="text-2xl font-bold text-white tabular-nums mt-1">0</p>
            </div>
            <div>
              <p class="text-slate-400 text-sm" data-i18n="unique_cards"></p>
              <p id="portfolio-unique" class="text-2xl font-bold text-white tabular-nums mt-1">0</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Game filter pills -->
      <div id="collection-filters" class="flex items-center gap-2 overflow-x-auto pb-2 mb-6 scrollbar-thin" role="group" aria-label="Filter collection by game"></div>

      <!-- Collection grid -->
      <div id="collection-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

      <!-- Empty state -->
      <div id="collection-empty" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 rounded-2xl bg-slate-800 flex items-center justify-center mb-6">
          <svg class="w-10 h-10 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 10h16M4 14h16M4 18h10" />
          </svg>
        </div>
        <p class="text-lg text-slate-300 font-medium mb-1" data-i18n="empty_title"></p>
        <p class="text-sm text-slate-400 mb-6" data-i18n="empty_hint"></p>
        <button id="btn-empty-search" class="px-5 py-2.5 rounded-lg text-sm font-semibold bg-amber-500 hover:bg-amber-600 text-slate-900 transition-all duration-200" data-i18n="search_cards_btn"></button>
      </div>

      <!-- Pagination -->
      <div id="collection-pagination" class="flex items-center justify-center gap-1 mt-8 hidden"></div>
    </section>

    <!-- ============ VIEW: SEARCH ============ -->
    <section id="view-search" class="view" hidden>
      <div class="mb-8">
        <label for="search-input" class="sr-only">Search cards</label>
        <div class="relative">
          <svg class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            data-i18n="search_placeholder"
            placeholder=""
            class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-12 pr-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200"
          />
        </div>
        <div id="search-filters" class="flex items-center gap-2 overflow-x-auto pb-2 mt-4 scrollbar-thin" role="group" aria-label="Filter search by game"></div>
        <p id="search-hint" class="text-xs text-slate-500 mt-2 hidden"></p>
      </div>

      <!-- Results -->
      <div id="search-results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>

      <!-- Search empty -->
      <div id="search-empty" class="hidden flex-col items-center justify-center py-20 text-center">
        <div class="w-20 h-20 rounded-2xl bg-slate-800 flex items-center justify-center mb-6">
          <svg class="w-10 h-10 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <p class="text-lg text-slate-300 font-medium" data-i18n="search_no_results"></p>
      </div>

      <!-- Pagination -->
      <div id="search-pagination" class="flex items-center justify-center gap-1 mt-8 hidden"></div>
    </section>
  </main>

  <!-- ============ MODAL: LOGIN ============ -->
  <div id="modal-login" role="dialog" aria-modal="true" aria-labelledby="modal-login-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-md w-full mt-20 border border-slate-700 shadow-2xl">
      <h2 id="modal-login-title" class="text-xl font-bold text-white mb-6" data-i18n="login_title"></h2>
      <form id="form-login" class="space-y-4" novalidate>
        <div>
          <label for="login-email" class="block text-sm text-slate-400 mb-1.5" data-i18n="email"></label>
          <input id="login-email" type="email" required autocomplete="email" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          <p class="error text-red-400 text-sm mt-1 hidden"></p>
        </div>
        <div>
          <label for="login-password" class="block text-sm text-slate-400 mb-1.5" data-i18n="password"></label>
          <input id="login-password" type="password" required autocomplete="current-password" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          <p class="error text-red-400 text-sm mt-1 hidden"></p>
        </div>
        <div id="login-form-error" class="hidden text-red-400 text-sm rounded-lg bg-red-500/10 border border-red-500/20 px-3 py-2 break-words"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2.5 rounded-lg transition-all duration-200 flex items-center justify-center gap-2">
          <span data-i18n="login_cta"></span>
        </button>
      </form>
      <p class="text-sm text-slate-400 mt-4 text-center">
        <span data-i18n="no_account"></span>
        <button id="btn-goto-register" class="text-amber-500 hover:text-amber-400 font-medium" data-i18n="register_link"></button>
      </p>
    </div>
  </div>

  <!-- ============ MODAL: REGISTER ============ -->
  <div id="modal-register" role="dialog" aria-modal="true" aria-labelledby="modal-register-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-md w-full mt-20 border border-slate-700 shadow-2xl">
      <h2 id="modal-register-title" class="text-xl font-bold text-white mb-6" data-i18n="register_title"></h2>
      <form id="form-register" class="space-y-4" novalidate>
        <div>
          <label for="register-email" class="block text-sm text-slate-400 mb-1.5" data-i18n="email"></label>
          <input id="register-email" type="email" required autocomplete="email" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          <p class="error text-red-400 text-sm mt-1 hidden"></p>
        </div>
        <div>
          <label for="register-password" class="block text-sm text-slate-400 mb-1.5" data-i18n="password"></label>
          <input id="register-password" type="password" required autocomplete="new-password" minlength="8" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          <p class="error text-red-400 text-sm mt-1 hidden"></p>
        </div>
        <p class="text-xs text-slate-500" data-i18n="password_rule"></p>
        <div id="register-form-error" class="hidden text-red-400 text-sm rounded-lg bg-red-500/10 border border-red-500/20 px-3 py-2 break-words"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2.5 rounded-lg transition-all duration-200">
          <span data-i18n="register_cta"></span>
        </button>
      </form>
      <p class="text-sm text-slate-400 mt-4 text-center">
        <span data-i18n="have_account"></span>
        <button id="btn-goto-login" class="text-amber-500 hover:text-amber-400 font-medium" data-i18n="login_link"></button>
      </p>
    </div>
  </div>

  <!-- ============ MODAL: ADD TO COLLECTION ============ -->
  <div id="modal-add" role="dialog" aria-modal="true" aria-labelledby="modal-add-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-md w-full mt-20 border border-slate-700 shadow-2xl">
      <h2 id="modal-add-title" class="text-xl font-bold text-white mb-4" data-i18n="add_title"></h2>
      <div id="add-card-summary" class="flex items-center gap-4 mb-6 p-3 rounded-lg bg-slate-800/60">
        <img id="add-card-image" src="" alt="" class="w-14 h-20 rounded-md bg-slate-700 object-cover" />
        <div class="min-w-0">
          <p id="add-card-name" class="font-semibold text-white truncate"></p>
          <p id="add-card-set" class="text-xs text-slate-400 truncate"></p>
          <p id="add-card-price" class="text-sm font-bold text-emerald-500 tabular-nums"></p>
        </div>
      </div>
      <form id="form-add" class="space-y-4" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="add-quantity" class="block text-sm text-slate-400 mb-1.5" data-i18n="quantity"></label>
            <input id="add-quantity" type="number" min="1" value="1" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
          <div>
            <label for="add-condition" class="block text-sm text-slate-400 mb-1.5" data-i18n="condition"></label>
            <select id="add-condition" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-amber-500/60 transition-all duration-200">
              <option value="Mint">Mint</option>
              <option value="Near Mint" selected>Near Mint</option>
              <option value="Lightly Played">Lightly Played</option>
              <option value="Played">Played</option>
              <option value="Damaged">Damaged</option>
            </select>
          </div>
          <div>
            <label for="add-language" class="block text-sm text-slate-400 mb-1.5" data-i18n="language"></label>
            <input id="add-language" type="text" maxlength="10" value="EN" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
          <div>
            <label for="add-purchase" class="block text-sm text-slate-400 mb-1.5" data-i18n="purchase_price"></label>
            <input id="add-purchase" type="number" min="0" step="0.01" placeholder="$0.00" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
        </div>
        <label class="flex items-center gap-3 cursor-pointer select-none">
          <input id="add-foil" type="checkbox" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-amber-500/30" />
          <span class="text-sm text-slate-300" data-i18n="foil"></span>
        </label>
        <div id="add-form-error" class="hidden text-red-400 text-sm rounded-lg bg-red-500/10 border border-red-500/20 px-3 py-2 break-words"></div>
        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2.5 rounded-lg transition-all duration-200 flex items-center justify-center gap-2">
          <span data-i18n="add_to_collection"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- ============ MODAL: EDIT ITEM ============ -->
  <div id="modal-edit" role="dialog" aria-modal="true" aria-labelledby="modal-edit-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-md w-full mt-20 border border-slate-700 shadow-2xl">
      <h2 id="modal-edit-title" class="text-xl font-bold text-white mb-6" data-i18n="edit_title"></h2>
      <form id="form-edit" class="space-y-4" novalidate>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="edit-quantity" class="block text-sm text-slate-400 mb-1.5" data-i18n="quantity"></label>
            <input id="edit-quantity" type="number" min="1" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
          <div>
            <label for="edit-condition" class="block text-sm text-slate-400 mb-1.5" data-i18n="condition"></label>
            <select id="edit-condition" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2.5 text-white focus:outline-none focus:border-amber-500/60 transition-all duration-200">
              <option value="Mint">Mint</option>
              <option value="Near Mint">Near Mint</option>
              <option value="Lightly Played">Lightly Played</option>
              <option value="Played">Played</option>
              <option value="Damaged">Damaged</option>
            </select>
          </div>
          <div>
            <label for="edit-language" class="block text-sm text-slate-400 mb-1.5" data-i18n="language"></label>
            <input id="edit-language" type="text" maxlength="10" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
          <div>
            <label for="edit-purchase" class="block text-sm text-slate-400 mb-1.5" data-i18n="purchase_price"></label>
            <input id="edit-purchase" type="number" min="0" step="0.01" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-amber-500/60 focus:ring-2 focus:ring-amber-500/20 transition-all duration-200" />
          </div>
        </div>
        <label class="flex items-center gap-3 cursor-pointer select-none">
          <input id="edit-foil" type="checkbox" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-amber-500 focus:ring-amber-500/30" />
          <span class="text-sm text-slate-300" data-i18n="foil"></span>
        </label>
        <div id="edit-form-error" class="hidden text-red-400 text-sm rounded-lg bg-red-500/10 border border-red-500/20 px-3 py-2 break-words"></div>
        <div class="flex gap-3">
          <button id="btn-edit-split" type="button" class="hidden w-1/2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2.5 rounded-lg transition-all duration-200" data-i18n="split_btn"></button>
          <button type="submit" class="flex-1 w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-semibold py-2.5 rounded-lg transition-all duration-200">
            <span data-i18n="save"></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ MODAL: CONFIRM DELETE ============ -->
  <div id="modal-delete" role="dialog" aria-modal="true" aria-labelledby="modal-delete-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-sm w-full mt-40 border border-slate-700 shadow-2xl text-center">
      <div class="w-14 h-14 rounded-full bg-red-500/10 flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      </div>
      <h3 id="modal-delete-title" class="text-lg font-bold text-white mb-2" data-i18n="delete_title"></h3>
      <p class="text-sm text-slate-400 mb-6" data-i18n="delete_message"></p>
      <div class="flex gap-3">
        <button id="btn-delete-cancel" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all duration-200" data-i18n="cancel"></button>
        <button id="btn-delete-confirm" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold bg-red-500 hover:bg-red-600 text-white transition-all duration-200" data-i18n="delete_confirm"></button>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: CARD DETAILS ============ -->
  <div id="modal-details" role="dialog" aria-modal="true" aria-labelledby="details-name" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl max-w-md w-full mt-20 border border-slate-700 shadow-2xl overflow-hidden">
      <div class="flex items-start gap-4 p-6 border-b border-slate-800">
        <img id="details-image" src="" alt="" class="w-24 h-[134px] rounded-lg bg-slate-800 object-cover hidden" />
        <div class="min-w-0 flex-1">
          <h2 id="details-name" class="text-lg font-bold text-white leading-snug"></h2>
          <p id="details-set" class="text-xs text-slate-400 mt-1"></p>
          <span id="details-game" class="badge-game inline-block mt-2"></span>
        </div>
        <button id="btn-details-close" class="text-slate-500 hover:text-slate-300 transition-colors" aria-label="Close">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-3">
        <div class="grid grid-cols-2 gap-3 text-sm">
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="quantity"></p>
            <p id="details-quantity" class="font-semibold text-white tabular-nums"></p>
          </div>
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="condition"></p>
            <p id="details-condition" class="font-semibold text-white"></p>
          </div>
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="language"></p>
            <p id="details-language" class="font-semibold text-white"></p>
          </div>
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="purchase_price"></p>
            <p id="details-purchase" class="font-semibold text-white tabular-nums"></p>
          </div>
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="market"></p>
            <p id="details-market" class="font-semibold text-emerald-500 tabular-nums"></p>
          </div>
          <div class="rounded-lg bg-slate-800/60 px-3 py-2">
            <p class="text-xs text-slate-500" data-i18n="total_value"></p>
            <p id="details-total" class="font-semibold text-white tabular-nums"></p>
          </div>
        </div>
        <p id="details-updated" class="text-xs text-slate-600 pt-1"></p>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: CONFIRM LOGOUT ============ -->
  <div id="modal-logout" role="dialog" aria-modal="true" aria-labelledby="modal-logout-title" class="fixed inset-0 z-50 hidden items-start justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300 p-4 overflow-y-auto">
    <div class="bg-slate-900 rounded-xl p-8 max-w-sm w-full mt-40 border border-slate-700 shadow-2xl text-center">
      <div class="w-14 h-14 rounded-full bg-slate-800 flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <h3 id="modal-logout-title" class="text-lg font-bold text-white mb-2" data-i18n="logout_title"></h3>
      <p class="text-sm text-slate-400 mb-6" data-i18n="logout_message"></p>
      <div class="flex gap-3">
        <button id="btn-logout-cancel" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all duration-200" data-i18n="cancel"></button>
        <button id="btn-logout-confirm" class="flex-1 px-4 py-2.5 rounded-lg text-sm font-semibold bg-slate-700 hover:bg-slate-600 text-white transition-all duration-200" data-i18n="logout_confirm"></button>
      </div>
    </div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-[60] flex flex-col gap-2 items-end" aria-live="polite"></div>

  <script src="/static/js/app.js"></script>
</body>
</html>
